name: Build site

on:
  workflow_run:
    workflows: ["Daily ETF Scrape"]
    types: [completed]
    branches: [main]

  push:
    branches: [main]
    paths:
      - 'predator/**'
      - 'markets/**'
      - 'docs/**'
      - 'config.yaml'
      - '.github/workflows/build_site.yml'
      - 'requirements.txt'

  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    # SKIP_MARKET_FETCH=true on plain code pushes — the committed JSON is already
    # up to date. Only re-fetch when the daily scraper ran or manual dispatch.
    env:
      SKIP_MARKET_FETCH: ${{ github.event_name == 'push' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Site-build deps only — no selenium/curl_cffi/pdfplumber (scraper-only)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml pyarrow pytest hypothesis yfinance openpyxl fredapi python-dotenv

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build site artifacts (predator)
        run: python -m predator.build --source data/all_history.csv --output docs/data --config config.yaml

      # ── Market data steps — skipped on plain code pushes ──────────────────
      - name: Fetch market data (yfinance)
        if: env.SKIP_MARKET_FETCH == 'false'
        run: |
          mkdir -p data/markets
          python -m markets.fetch_yf --out data/markets
        continue-on-error: true

      - name: Fetch FRED data
        if: env.SKIP_MARKET_FETCH == 'false'
        run: python -m markets.fetch_fred --out data/markets
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Build markets.json + sim_underlyings.json
        if: env.SKIP_MARKET_FETCH == 'false'
        run: python -m markets.build --source data/markets --output docs/data
        continue-on-error: true

      - name: Fetch market returns history (FRED + yfinance)
        if: env.SKIP_MARKET_FETCH == 'false'
        run: python -m predator.markets_history --full-refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Ingest Mega Markets Historical (Excel)
        if: env.SKIP_MARKET_FETCH == 'false'
        run: python -m predator.ingest_mega_xl
        continue-on-error: true

      - name: Fetch vol history (CBOE indices from FRED)
        if: env.SKIP_MARKET_FETCH == 'false'
        run: python -m predator.vol_history --full-refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Verify outputs
        run: |
          test -f docs/data/leaderboard.json
          test -f docs/data/holdings_latest.json
          test -f docs/data/changelog.json
          test -f docs/data/metadata.json
          test -f docs/data/leaderboard.parquet
          ls -lh docs/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
