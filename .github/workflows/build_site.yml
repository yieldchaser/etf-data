name: Build site

# Trigger policy:
#   * filtered pushes to main for site/data changes
#   * manual workflow_dispatch for hotfixes
# External ETF flow ingestion is intentionally disabled; the build validates and
# regenerates the checked-in local flow artifacts before upload.
on:
  push:
    branches: [main]
    paths:
      - 'conviction/**'
      - 'markets/**'
      - 'docs/**'
      - 'data/**'           # rebuild whenever raw data is pushed (scraper or hotfix)
      - 'scraper.py'
      - 'scripts/build_local_flow_artifacts.py'
      - 'FUND_FLOW_ETFS.md'
      - 'config.yaml'
      - 'config.json'
      - '.github/workflows/build_site.yml'
      - 'requirements.txt'
      - 'tests/**'

  workflow_dispatch:

  # Reusable entry point retained for callers; FRED key stays optional so the
  # build still works when a caller has no secret to pass.
  workflow_call:
    secrets:
      FRED_API_KEY:
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write   # commit-back of accumulated stock-detail coverage
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # hung FRED/yfinance fetch must not burn the 360-min default
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build from latest main: push events already land on main,
          # and manual dispatches must never build a stale ref.
          ref: main
          fetch-depth: 2
          # lfs:true is REQUIRED — data/Mega_Markets_Historical.xlsx lives in
          # Git LFS; with the default lfs:false the deep-history seed ingests
          # a tiny pointer file and fails silently under continue-on-error.
          lfs: true

      - name: Determine change scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Trigger is ${{ github.event_name }} -> running full data pipeline."
            exit 0
          fi

          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Single commit / no parent -> running full data pipeline."
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "Files changed in commit:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(data/|conviction/|markets/|scraper\.py|config\.|requirements\.txt|\.github/workflows/build_site\.yml)'; then
            echo "full_build=true" >> "$GITHUB_OUTPUT"
            echo "Data, model, or workflow files modified -> running full data pipeline."
          else
            echo "full_build=false" >> "$GITHUB_OUTPUT"
            echo "Only frontend / docs / UI tests modified -> running fast site build."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Build deps only — selenium/curl_cffi/pdfplumber are scraper-only, not needed here
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Tests (contract name: 'Run tests') ────────────────────────────
      - name: Run tests
        run: |
          if [ "${{ steps.scope.outputs.full_build }}" = "false" ]; then
            echo "Fast path: running flow dataset and UI tests"
            python -m pytest tests/test_local_flow_artifacts.py tests/test_flow_ui.py tests/test_flow_ui_metrics.py tests/test_ci_config.py -v
          else
            echo "Full build: running complete test suite"
            python -m pytest tests/ -v
          fi

      # ── Restore / Cache conviction artifacts ──────────────────────────
      # For frontend-only iterations, data/history_parquet and conviction code
      # are identical. Restoring these artifacts takes ~3 seconds instead of
      # 4.5 minutes of compute. If the cache misses, conviction.build runs.
      - name: Cache conviction artifacts
        id: cache_conviction
        uses: actions/cache@v4
        with:
          path: |
            docs/data/leaderboard.json
            docs/data/holdings_latest.json
            docs/data/changelog.json
            docs/data/metadata.json
            docs/data/leaderboard.parquet
            docs/data/score_history.json
            docs/data/holdings_history.json
            docs/data/flag_history.json
          key: conviction-artifacts-${{ hashFiles('data/history_parquet/**', 'conviction/**', 'config.yaml', 'config.json') }}

      # ── Markets data pipeline ─────────────────────────────────────────
      # ORDER (charter v2 Part 2 — self-living merge):
      #   1. Excel BACKFILL ONLY: seed deep history (gold 1833+, S&P 1871+).
      #   2. Live FRED+yfinance: extend each series with current months and
      #      populate fx/cpi/rates. Source labels from this step are PRESERVED
      #      by the Excel ingester — Excel is no longer re-run after this.
      - name: 1/2 — Markets Excel deep-history seed (backfill only)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m conviction.ingest_markets_xl --no-fail-on-stale
        continue-on-error: true

      - name: 2/2 — Live FRED + yfinance merge (current months, fx, cpi, rates)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m conviction.markets_history --full-refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Build site artifacts (conviction)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m conviction.build --source data/all_history.csv --output docs/data --config config.yaml

      # ── Portfolio Lab price data (§22.1) ──────────────────────────────
      - name: Fetch Portfolio Lab prices (yfinance adjusted-close)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        id: fetch_prices
        run: python -m conviction.fetch_prices

      # ── Stock detail files — per-ticker description + 2-year daily prices ──
      # Writes docs/data/details/{TICKER}.json for lazy-loading in the UI.
      # Uses committed data/company_descriptions.json as a description cache
      # so only new tickers need to be queried on each build (rate-limit safe).
      - name: Fetch stock details (descriptions + 2-year price history)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        id: fetch_stock_details
        # batch-size 250: with leaderboard-rank prioritisation this resolves the
        # full top-250-by-rank in one run, then keeps growing the long tail
        # ~250/run. continue-on-error: never break the build if yfinance is flaky.
        run: python -m conviction.fetch_stock_details --batch-size 250
        continue-on-error: true

      # ── Persist self-healing stock-detail coverage back to main ──────────
      # fetch_stock_details resolves ~150 new tickers per run and writes them
      # to docs/data/details/ plus data/coverage_state.json and the description
      # cache. Without committing these back, every build re-reads coverage=0
      # and reprocesses the SAME first batch forever, so the long tail of
      # tickers never gets a detail page (permanent 404s). Commit them so
      # coverage accumulates to full over successive runs.
      - name: Persist stock-detail coverage (accumulate across runs)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data/details data/coverage_state.json data/company_descriptions.json
          if git diff --staged --quiet; then
            echo "No stock-detail coverage changes to commit."
          else
            git commit -m "Auto-update: stock-detail coverage 📊 [skip ci]"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Stock-detail rebase conflict; refusing remote-overwrite resolution." >&2
                exit 1
              fi
              echo "Stock-detail push attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            done
            if [ "$pushed" != true ]; then
              echo "Could not push stock-detail coverage after three attempts" >&2
              exit 1
            fi
            echo "Committed accumulated stock-detail coverage."
          fi

      # Step 4: Price log (markets.json) — separate from market_returns.json
      - name: Fetch market data (yfinance price log)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/markets
          python -m markets.fetch_yf --out data/markets
        continue-on-error: true

      - name: Fetch FRED data (price log)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m markets.fetch_fred --out data/markets
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Build markets.json + sim_underlyings.json
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m markets.build --source data/markets --output docs/data
        continue-on-error: true

      # Step 5: Vol history (separate file)
      - name: Fetch vol history (CBOE indices from FRED)
        if: steps.scope.outputs.full_build == 'true' || steps.cache_conviction.outputs.cache-hit != 'true'
        run: python -m conviction.vol_history --full-refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Verify outputs
        run: |
          test -f docs/data/leaderboard.json
          test -f docs/data/holdings_latest.json
          test -f docs/data/changelog.json
          test -f docs/data/metadata.json
          test -f docs/data/leaderboard.parquet
          test -f docs/data/score_history.json
          test -f docs/data/holdings_history.json
          test -f docs/data/flag_history.json
          test -f docs/data/prices.json
          test -f docs/data/market_returns.json          # Verify market_returns.json has the §2.3 contract shape (monthly arrays, not close dicts)
          python -c "
          import json, sys, datetime, os
          d = json.load(open('docs/data/market_returns.json'))
          assert 'asof' in d, 'missing asof'
          assert 'assets' in d, 'missing assets'
          assets = d['assets']
          assert len(assets) > 0, 'no assets'
          # Check first asset has monthly array (not close dict)
          first = next(iter(assets.values()))
          assert 'monthly' in first, f'asset missing monthly array: {list(first.keys())}'
          assert isinstance(first['monthly'], list), 'monthly must be a list'
          assert isinstance(first['monthly'][0], list), 'monthly entries must be [YYYY-MM, val] pairs'
          print(f'market_returns.json OK: {len(assets)} assets, asof={d[\"asof\"]}')
          # Freshness + sections gate: a stale or gutted market payload must
          # FAIL the build instead of passing silently under continue-on-error
          # above. ALLOW_EMPTY_MARKETS=1 is the escape hatch for deliberate
          # cache-only runs.
          if os.environ.get('ALLOW_EMPTY_MARKETS') == '1':
              print('ALLOW_EMPTY_MARKETS=1 — skipping rates/cpi/freshness gate')
          else:
              rates, cpi = d.get('rates') or {}, d.get('cpi') or {}
              assert rates, 'rates section EMPTY — upstream FRED outage masked; fail build'
              assert cpi, 'cpi section EMPTY — upstream FRED outage masked; fail build'
              # asof is month-granular (YYYY-MM); fromisoformat pads to the 1st
              try:
                  asof = datetime.date.fromisoformat(d['asof'])
              except ValueError:
                  asof = datetime.date.fromisoformat(d['asof'] + '-01')
              age = (datetime.date.today() - asof).days
              assert age <= 40, f'market_returns.json {age}d stale (asof={asof})'
              print(f'markets gate OK: rates={len(rates)}, cpi={len(cpi)}, asof age={age}d')
          "
          # Leaderboard sanity check: valid JSON + non-zero entry count
          python -c "
          import json, sys
          lb = json.load(open('docs/data/leaderboard.json'))
          assert isinstance(lb, list), 'leaderboard.json must be a list'
          assert len(lb) > 0, f'leaderboard.json is empty — build may have failed'
          print(f'leaderboard.json OK: {len(lb)} entries')
          "
          ls -lh docs/data/
          # Portfolio Lab sanity check: required JSON + non-zero ticker count
          python -c "
          import json, sys
          p = json.load(open('docs/data/prices.json'))
          assert isinstance(p.get('tickers'), dict), 'prices.json tickers must be a dict'
          assert len(p['tickers']) > 0, 'prices.json has no tickers'
          assert p.get('asof'), 'prices.json missing asof'
          print(f'prices.json OK: {len(p[\"tickers\"])} tickers, asof={p[\"asof\"]}')
          "

      - name: Build local ETF flow artifacts
        run: python scripts/build_local_flow_artifacts.py --output-dir docs/data/flows

      - name: Verify complete local ETF flow artifacts
        run: |
          python scripts/build_local_flow_artifacts.py --verify-output --output-dir docs/data/flows
          python -c "
          import json
          catalog = json.load(open('docs/data/flows/catalog.json'))
          manifest = json.load(open('docs/data/flows/manifest.json'))
          assert catalog['counts']['instruments'] == 150, catalog['counts']
          assert catalog['counts']['featured'] == 24, catalog['counts']
          assert 'watch_tier' not in catalog, 'catalog must not export a watch tier'
          assert manifest['counts']['instruments'] == 150, manifest['counts']
          assert manifest['complete'] is True and manifest['status'] == 'complete', manifest['status']
          assert manifest['source']['network_fetch'] is False, manifest['source']
          assert catalog['source']['network_fetch'] is False, catalog['source']
          print('local ETF flow artifacts OK: 150 instruments, 24 featured, no watch tier, no network fetch')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20   # deploys are fast; a hang here must not block the queue
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
