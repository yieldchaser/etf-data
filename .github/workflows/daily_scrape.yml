name: Daily ETF Scrape

on:
  schedule:
    # Weekday schedule (Mon–Fri) — three runs per day:
    #   02:00 UTC = 10:00 PM ET  — late-night: catches Invesco T+1 that publishes after 6 PM ET
    #   14:00 UTC = 10:00 AM ET  — primary:    all sources guaranteed fresh after overnight publish
    #   22:00 UTC = 06:00 PM ET  — catch-all:  late publishers and mid-day retries
    - cron: '0 2,14,22 * * 1-5'
    # Weekend schedule (Sat–Sun) — one run per day at 10 AM ET:
    #   Saturday:  Invesco T+1 for Friday's close publishes Saturday night — captures the
    #              Friday effectiveDate that is structurally missing from the weekday runs.
    #   Sunday:    safety net for any Saturday-published updates.
    #   Worst case: no new data → git diff is empty → nothing commits (zero cost).
    - cron: '0 14 * * 0,6'
  workflow_dispatch:      # Manual Run Button

concurrency:
  # Serialize ALL triggers (three weekday crons, weekend cron, manual
  # dispatch). Overlapping runs each commit the same binary parquet
  # (data/history_parquet/year=YYYY/holdings.parquet) and
  # `git pull --rebase -X theirs` cannot resolve BINARY conflicts — the
  # rebase halts and the ephemeral runner discards folded rows forever.
  # MUST stay false: cancelling a run mid-scrape drops that window's rows;
  # a QUEUED run simply waits and re-hydrates from the parquet store, so
  # serialization loses nothing.
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # hung Playwright/yfinance must not burn the 360-min default
    permissions:
      contents: write
      actions: write    # dispatch build_site after data commit (GITHUB_TOKEN
                        # pushes do NOT trigger other workflows' push-path
                        # triggers — explicit dispatch is the only chain)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          pip install -r requirements-scraper.txt
          # pyarrow is required for the history-isolation layer
          # (hydrate_csv_from_parquet.py + migrate_to_parquet.py). It is in
          # requirements.txt already, but pinned here for clarity since the
          # Parquet store is now the SOLE durable history — a missing dep
          # would silently no-op the persistence step.
          pip install pyarrow==18.0.0
          python -m playwright install chromium --with-deps

      # ── History isolation: hydrate the working CSV from the Parquet store ──
      # data/all_history.csv is no longer committed to Git (the daily append
      # was the dominant driver of .git growth). The committed, SHA-256-guarded
      # Parquet store (data/history_parquet/) is the durable history. Each run
      # reconstructs the CSV before scraper.py so the scraper sees the exact
      # file it expects — byte-identical to what used to be in Git. Verified by
      # scripts/validate_zero_loss.py. scraper.py itself is UNCHANGED.
      - name: Hydrate all_history.csv from Parquet store
        run: python scripts/hydrate_csv_from_parquet.py

      - name: Run Scraper
        run: xvfb-run -a python scraper.py

      # ── Permanent year-partitioned archive (charter v2 Part 3) ─────────
      # Fold today's appended rows into data/history_parquet/year=YYYY/holdings.parquet
      # and refresh CHECKSUMS.json. Past-year partitions are contractually
      # immutable — the migrate script REFUSES to overwrite them.
      #
      # This step is now MANDATORY (no longer continue-on-error). The Parquet
      # store is the SOLE durable home for holdings history now that
      # all_history.csv is untracked. If migrate fails, the CSV wipe step below
      # is skipped (id: parquet_persist checks out) so the local CSV survives
      # and the run fails loudly — never silently lose a day's scrape.
      - name: Update parquet archive (persist today's scrape)
        id: parquet_persist
        run: python scripts/migrate_to_parquet.py

      # Advisory drift check only — never blocks the run. Recomputes SHA-256
      # vs the manifest; a past-year drift here is a loud signal but the
      # authoritative persistence already happened in the step above.
      - name: Verify parquet immutability (advisory)
        run: python scripts/migrate_to_parquet.py --verify-only
        continue-on-error: true

      # ── History isolation: wipe the local CSV so Git never stages it ─────
      # Runs ONLY after parquet persistence succeeded. The CSV is the
      # transient working buffer between hydrate → scraper → migrate; once
      # migrate has folded it into the store, it is dead weight on disk and
      # MUST be removed before `git add data/` below — otherwise it would be
      # re-staged and re-committed, defeating the whole isolation strategy.
      # If migrate failed, this step is skipped and the run fails on the
      # missing `parquet_persist` outcome check, preserving the CSV on disk.
      # Year-rollover guard: if migrate spilled locked prior-year rows to
      # all_history_refused.csv (January T-1 dates hitting the immutable
      # partition), the CSV is KEPT for the retry/fold path — wiping it
      # would permanently erase those days (audit: fold-loss time bomb).
      - name: Wipe local all_history.csv (post-persist)
        if: steps.parquet_persist.outcome == 'success'
        run: |
          if [ -s data/all_history_refused.csv ]; then
            echo "⚠️ Locked prior-year rows pending fold (data/all_history_refused.csv) — keeping all_history.csv so no day is lost."
            exit 0
          fi
          rm -f data/all_history.csv
          echo "✓ Wiped local data/all_history.csv — Parquet store is the sole history."

      - name: Save Data
        id: save_data
        if: steps.parquet_persist.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit + push if there are actual changes
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "data_changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: Daily Holdings Data 📈"
            # Pull --rebase to incorporate any commits pushed to main while the scraper ran
            git pull --rebase --autostash -X theirs origin main
            git push origin main
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

      # ── Trigger site rebuild ──────────────────────────────────────────
      # GITHUB_TOKEN pushes do NOT trigger other workflows' push-path
      # triggers (GitHub anti-loop policy). The old workflow_run trigger
      # was correctly removed (it raced the push-path trigger), but the
      # explicit dispatch is the SOLE reliable chain mechanism left.
      # Only fires when data_changed == 'true', so no-change days are free.
      - name: Trigger site rebuild
        if: steps.save_data.outputs.data_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build_site.yml',
              ref: 'main',
            });
            console.log('Build site workflow dispatched.');
