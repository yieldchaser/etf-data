name: Daily ETF Scrape

on:
  schedule:
    # Weekday schedule (Mon–Fri) — three runs per day:
    #   02:00 UTC = 10:00 PM ET  — late-night: catches Invesco T+1 that publishes after 6 PM ET
    #   14:00 UTC = 10:00 AM ET  — primary:    all sources guaranteed fresh after overnight publish
    #   22:00 UTC = 06:00 PM ET  — catch-all:  late publishers and mid-day retries
    - cron: '0 2,14,22 * * 1-5'
    # Weekend schedule (Sat–Sun) — one run per day at 10 AM ET:
    #   Saturday:  Invesco T+1 for Friday's close publishes Saturday night — captures the
    #              Friday effectiveDate that is structurally missing from the weekday runs.
    #   Sunday:    safety net for any Saturday-published updates.
    #   Worst case: no new data → git diff is empty → nothing commits (zero cost).
    - cron: '0 14 * * 0,6'
  workflow_dispatch:      # Manual Run Button

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write    # needed to dispatch build_site workflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          pip install -r requirements-scraper.txt
          python -m playwright install chromium --with-deps

      - name: Run Scraper
        run: xvfb-run -a python scraper.py

      # ── Permanent year-partitioned archive (charter v2 Part 3) ─────────
      # Append today's scrape into data/history_parquet/year=YYYY/holdings.parquet
      # and refresh data/history_parquet/CHECKSUMS.json. Past-year partitions
      # are contractually immutable — the migrate script REFUSES to overwrite
      # them. On any drift, --verify-only fails CI loudly. continue-on-error
      # is set so a parquet hiccup never blocks the CSV-side scrape commit.
      - name: Update parquet archive (immutable past years)
        run: |
          python scripts/migrate_to_parquet.py
          python scripts/migrate_to_parquet.py --verify-only
        continue-on-error: true

      - name: Save Data
        id: save_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit + push if there are actual changes
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            echo "data_changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update: Daily Holdings Data 📈"
            # Pull --rebase to incorporate any commits pushed to main while the scraper ran
            git pull --rebase --autostash -X theirs origin main
            git push origin main
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger site rebuild
        # Explicitly dispatch the Build Site workflow after new data is pushed.
        # Belt-and-suspenders alongside the workflow_run trigger in build_site.yml.
        if: steps.save_data.outputs.data_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build_site.yml',
              ref: 'main',
            });
            console.log('Build site workflow dispatched.');

