name: ETF fund flows ingestion (disabled)

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "This workflow is disabled and will not ingest external flow data"
        required: true
        default: "External ingestion disabled"
        type: string

permissions:
  contents: read

concurrency:
  group: daily-flows
  cancel-in-progress: false

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report local-only policy
        run: |
          echo "External ETF flow ingestion is intentionally disabled."
          echo "The authoritative data is under data/flows and is rebuilt with scripts/build_local_flow_artifacts.py."
          echo "No Trackinsight or other network request is made by this workflow."
          exit 1
