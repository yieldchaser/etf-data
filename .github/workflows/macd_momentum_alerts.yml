name: Quantitative MACD Momentum Radar & Pre-Close Alert

'on':
  schedule:
    # Mon-Fri schedule aligned to US equity market sessions:
    # 13:30 UTC = 08:30 EST (Pre-Market Indicative Radar)
    - cron: '30 13 * * 1-5'
    # 35 mins past the hour (15:35 to 20:35 UTC = 10:35 to 15:35 EST, 5 mins after each 1H bar closes!)
    - cron: '35 15,16,17,18,19,20 * * 1-5'
    # 20:00 UTC = 15:00 EST (The Pre-Market-Close Golden Hour Diagnostic)
    - cron: '0 20 * * 1-5'
    # 21:05 UTC = 16:05 EST (Post-Close Final Session Audit)
    - cron: '5 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send email alert regardless of deduplication state"
        required: false
        default: false
        type: boolean
      recipient:
        description: "Custom recipient email"
        required: false
        default: ""
        type: string
      limit:
        description: "Limit number of tickers scanned (0 = full 160 universe)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: macd-momentum-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run 1-Hour & 1-Day MACD Momentum Scanner
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
        run: |
          flags="--send-email"
          if [ "${{ inputs.force_send }}" = "true" ]; then
            flags="$flags --force-send"
          fi
          if [ -n "${{ inputs.recipient }}" ]; then
            flags="$flags --recipient ${{ inputs.recipient }}"
          fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            flags="$flags --limit ${{ inputs.limit }}"
          fi
          python scripts/build_macd_scanner.py $flags

      - name: Commit and push updated MACD signals to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/macd/signals.json docs/data/macd/latest_alert.json docs/data/flows/macd_signals.json docs/data/flows/latest_macd_alert.json || true
          if git diff --staged --quiet; then
            echo "No changes in MACD signals to commit."
          else
            git commit -m "Auto-update: 1H MACD momentum signals & alerts [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
