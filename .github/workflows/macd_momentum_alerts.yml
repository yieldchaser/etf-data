name: Quantitative MACD Momentum Radar & Pre-Close Alert

on:
  schedule:
    # Institutional Trading Decision Windows & Continuous Volatility Radar (Mon-Fri):
    # Filtered at runtime by America/New_York clock check (08:00-20:30 ET) so pre-market,
    # open, regular trading, pre-close golden hour, and post-market settlement are all covered
    # resiliently even across severe GitHub Actions schedule congestion delays.
    - cron: '28 12,13 * * 1-5'             # 08:28 EDT / 08:28 EST (Pre-Market Indicative Radar)
    - cron: '37 13,14 * * 1-5'             # 09:37 EDT / 09:37 EST (Opening Session Confirmation)
    - cron: '7,37 15,16,17,18,19 * * 1-5'  # Continuous 30-Min Intraday Volatility & Momentum Radar
    - cron: '3,37 19,20 * * 1-5'           # 15:03 & 15:37 EDT/EST (Pre-Close Golden Hour & Closing Auction)
    - cron: '7,37 20,21 * * 1-5'           # 16:07 & 16:37 EDT/EST (Official Market Close & Settlement)
    - cron: '15 22,23 * * 1-5'             # 17:15 & 18:15 EST / 18:15 & 19:15 EDT (Reconciliation & Fail-Safe Catch-Up)
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send email alert regardless of deduplication state"
        required: false
        default: false
        type: boolean
      recipient:
        description: "Custom recipient email"
        required: false
        default: ""
        type: string
      limit:
        description: "Limit number of tickers scanned (0 = full 160 universe)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: macd-momentum-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check US market window (DST-safe ET gate)
        id: market_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "Non-schedule trigger (${{ github.event_name }}) -> bypassing ET clock gate."
            exit 0
          fi
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now_et = datetime.now(ZoneInfo("America/New_York"))
          mins = now_et.hour * 60 + now_et.minute
          in_win = (now_et.weekday() < 5) and (8 * 60 <= mins <= 20 * 60 + 30)
          print(f"Current ET: {now_et.strftime('%Y-%m-%d %H:%M:%S %Z')} -> in_window={in_win}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"in_window={'true' if in_win else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.market_window.outputs.in_window == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.market_window.outputs.in_window == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pytest

      - name: Pre-Flight Automated Regression Checks
        if: steps.market_window.outputs.in_window == 'true'
        run: |
          python -m pytest tests/test_macd_scanner.py -q

      - name: Run 1-Hour & 1-Day MACD Momentum Scanner
        if: steps.market_window.outputs.in_window == 'true'
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
        run: |
          flags="--send-email"
          if [ "${{ inputs.force_send }}" = "true" ]; then
            flags="$flags --force-send"
          fi
          if [ -n "${{ inputs.recipient }}" ]; then
            flags="$flags --recipient ${{ inputs.recipient }}"
          fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            flags="$flags --limit ${{ inputs.limit }}"
          fi
          python scripts/build_macd_scanner.py $flags

      - name: Commit and push updated MACD signals to GitHub Pages
        id: commit_macd
        if: ${{ steps.market_window.outputs.in_window == 'true' && (github.event_name != 'workflow_dispatch' || inputs.limit == '' || inputs.limit == '0') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/macd/signals.json docs/data/macd/latest_alert.json docs/data/flows/macd_signals.json docs/data/flows/latest_macd_alert.json docs/data/macd/history/*.json docs/data/flows/history/*.json || true
          if git diff --staged --quiet; then
            echo "No changes in MACD signals to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update: 1H MACD momentum signals & alerts"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Rebase conflict; retrying..." >&2
              fi
              echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..." >&2
              sleep $((attempt * 5))
            done
            if [ "$pushed" = "true" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Could not push MACD signals after 3 attempts." >&2
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger site deployment to publish new MACD data to Pages
        if: steps.commit_macd.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build_site.yml --ref main || true

      # GitHub drops scheduled runs under load (all of 2026-11-17's intraday crons were skipped),
      # so each run re-dispatches the next scan itself during market hours. The concurrency group
      # keeps at most one running + one pending run, so cron runs and chain dispatches collapse
      # into a single chain; email dedup prevents repeat sends.
      - name: Chain next scan (fallback for dropped cron runs)
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.limit == '' || inputs.limit == '0') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wait_s=$(python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          mins = now.hour * 60 + now.minute
          if now.weekday() >= 5 or mins >= 16 * 60 + 40:
              print(-1)
          else:
              nxt = 7 if now.minute < 7 else 37 if now.minute < 37 else 67
              print(max(60, (nxt - now.minute) * 60 - now.second))
          PY
          )
          if [ "$wait_s" -lt 0 ]; then echo "After close / weekend: no chain."; exit 0; fi
          echo "Next scan in ${wait_s}s"; sleep "$wait_s"
          gh workflow run macd_momentum_alerts.yml --ref main
