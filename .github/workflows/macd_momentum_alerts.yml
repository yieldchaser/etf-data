name: Quantitative MACD Momentum Radar & Pre-Close Alert

'on':
  schedule:
    # Continuous Mon-Fri execution across US trading sessions:
    # 13:30 UTC = 08:30 EST (Pre-Market Indicative Radar)
    - cron: '30 13 * * 1-5'
    # Regular trading hours: 09:30 to 16:00 EST (14:30 to 21:00 UTC)
    # Check every 30 mins (at :05 and :35 after every hour & 1H bar close)
    - cron: '5,35 14-20 * * 1-5'
    # 20:00 UTC = 15:00 EST (The Pre-Market-Close Golden Hour Diagnostic)
    - cron: '0 20 * * 1-5'
    # 21:05 UTC = 16:05 EST (Post-Close Final Session Audit)
    - cron: '5 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send email alert regardless of deduplication state"
        required: false
        default: false
        type: boolean
      recipient:
        description: "Custom recipient email"
        required: false
        default: ""
        type: string
      limit:
        description: "Limit number of tickers scanned (0 = full 160 universe)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: macd-momentum-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run 1-Hour & 1-Day MACD Momentum Scanner
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
        run: |
          flags="--send-email"
          if [ "${{ inputs.force_send }}" = "true" ]; then
            flags="$flags --force-send"
          fi
          if [ -n "${{ inputs.recipient }}" ]; then
            flags="$flags --recipient ${{ inputs.recipient }}"
          fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            flags="$flags --limit ${{ inputs.limit }}"
          fi
          python scripts/build_macd_scanner.py $flags

      - name: Commit and push updated MACD signals to GitHub Pages
        id: commit_macd
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limit == '' || inputs.limit == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/macd/signals.json docs/data/macd/latest_alert.json docs/data/flows/macd_signals.json docs/data/flows/latest_macd_alert.json || true
          if git diff --staged --quiet; then
            echo "No changes in MACD signals to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update: 1H MACD momentum signals & alerts"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Rebase conflict; retrying..." >&2
              fi
              echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..." >&2
              sleep $((attempt * 5))
            done
            if [ "$pushed" = "true" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Could not push MACD signals after 3 attempts." >&2
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger site deployment to publish new MACD data to Pages
        if: steps.commit_macd.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build_site.yml --ref main || true
