name: Hourly MACD Momentum Radar & Pre-Close Alert

'on':
  schedule:
    # Run hourly during US equity market hours (Mon-Fri)
    # 14:00, 15:00, 16:00, 17:00, 18:00, 19:00, 20:00 UTC (09:00 to 15:00 EST / 10:00 to 16:00 EDT)
    # The 20:00 UTC (15:00 EST / 3:00 PM EST) trigger is the critical pre-market-close scan.
    - cron: '0 14,15,16,17,18,19,20 * * 1-5'
  workflow_dispatch:
    inputs:
      send_email:
        description: "Force send email alert regardless of trigger threshold"
        required: false
        default: true
        type: boolean
      limit:
        description: "Limit number of tickers scanned (0 = full universe)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: macd-momentum-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run 1-Hour & 1-Day MACD Momentum Scanner
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
        run: |
          send_flag=""
          if [ "${{ inputs.send_email }}" != "false" ]; then
            send_flag="--send-email"
          fi
          limit_flag=""
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            limit_flag="--limit ${{ inputs.limit }}"
          fi
          python scripts/build_macd_scanner.py $send_flag $limit_flag

      - name: Commit and push updated MACD signals to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/flows/macd_signals.json docs/data/flows/latest_macd_alert.json || true
          if git diff --staged --quiet; then
            echo "No changes in MACD signals to commit."
          else
            git commit -m "Auto-update: 1H MACD momentum signals & alerts [skip ci]"
            git push origin main
          fi
