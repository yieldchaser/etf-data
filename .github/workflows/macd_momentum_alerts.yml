name: Quantitative MACD Momentum Radar & Pre-Close Alert

on:
  schedule:
    # Institutional Trading Decision Windows & 30-Minute Intraday Heartbeat (Mon-Fri):
    # Pre-Market & Open Confirmation (offset from top-of-5m cron congestion spikes):
    - cron: '28 13 * * 1-5' # 08:28 EST (Pre-Market Indicative Radar)
    - cron: '37 14 * * 1-5' # 09:37 EST (Opening Session Confirmation - Captures Open Gaps & Surges)
    # Continuous 30-Min Intraday Volatility & Momentum Radar (10:07 to 14:37 EST = 15:07 to 19:37 UTC):
    - cron: '7 15 * * 1-5'  # 10:07 EST
    - cron: '37 15 * * 1-5' # 10:37 EST
    - cron: '7 16 * * 1-5'  # 11:07 EST
    - cron: '37 16 * * 1-5' # 11:37 EST
    - cron: '7 17 * * 1-5'  # 12:07 EST
    - cron: '37 17 * * 1-5' # 12:37 EST
    - cron: '7 18 * * 1-5'  # 13:07 EST
    - cron: '37 18 * * 1-5' # 13:37 EST
    - cron: '7 19 * * 1-5'  # 14:07 EST
    - cron: '37 19 * * 1-5' # 14:37 EST
    # Pre-Close Golden Hour & Closing Auction Scan (15:03 & 15:37 EST = 20:03 & 20:37 UTC):
    - cron: '3 20 * * 1-5'  # 15:03 EST (Pre-Close Golden Hour Scan)
    - cron: '37 20 * * 1-5' # 15:37 EST (Closing Auction Momentum)
    # Post-Close Official Settlement & Pivot Derivation (16:07 EST = 21:07 UTC):
    - cron: '7 21 * * 1-5'  # 16:07 EST (Post-Close Official Settlement)
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send email alert regardless of deduplication state"
        required: false
        default: false
        type: boolean
      recipient:
        description: "Custom recipient email"
        required: false
        default: ""
        type: string
      limit:
        description: "Limit number of tickers scanned (0 = full 160 universe)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: macd-momentum-alerts
  cancel-in-progress: false

jobs:
  scan-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run 1-Hour & 1-Day MACD Momentum Scanner
        env:
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECIPIENT: ${{ secrets.ALERT_EMAIL_RECIPIENT }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
        run: |
          flags="--send-email"
          if [ "${{ inputs.force_send }}" = "true" ]; then
            flags="$flags --force-send"
          fi
          if [ -n "${{ inputs.recipient }}" ]; then
            flags="$flags --recipient ${{ inputs.recipient }}"
          fi
          if [ -n "${{ inputs.limit }}" ] && [ "${{ inputs.limit }}" != "0" ]; then
            flags="$flags --limit ${{ inputs.limit }}"
          fi
          python scripts/build_macd_scanner.py $flags

      - name: Commit and push updated MACD signals to GitHub Pages
        id: commit_macd
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.limit == '' || inputs.limit == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/macd/signals.json docs/data/macd/latest_alert.json docs/data/flows/macd_signals.json docs/data/flows/latest_macd_alert.json docs/data/macd/history/*.json docs/data/flows/history/*.json || true
          if git diff --staged --quiet; then
            echo "No changes in MACD signals to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update: 1H MACD momentum signals & alerts"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push origin HEAD:main; then
                  pushed=true
                  break
                fi
              else
                git rebase --abort >/dev/null 2>&1 || true
                echo "Rebase conflict; retrying..." >&2
              fi
              echo "Push attempt $attempt failed; retrying in $((attempt * 5))s..." >&2
              sleep $((attempt * 5))
            done
            if [ "$pushed" = "true" ]; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "Could not push MACD signals after 3 attempts." >&2
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Trigger site deployment to publish new MACD data to Pages
        if: steps.commit_macd.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build_site.yml --ref main || true
