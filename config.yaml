# Predator Protocol — scoring & sanitizer configuration.
# CALIBRATED to match the Excel Power Query (`Master_Leaderboard`) exactly.
# Source M code transcribed from Equity_Indices_.xlsb Advanced Editor screenshots.
#
# Push a change here → site auto-rebuilds.

# =============================================================================
# SANITIZER — mirrors the Power Query `Filtered Rows` step verbatim.
# Plus the documented GOOG → GOOGL `FixGoogle` normalization.
# =============================================================================
sanitizer:
  # Power Query: [Ticker] <> "$USD" and [Ticker] <> "USD"
  blocked_tickers:
    - USD
    - $USD
    - $CAD            # VBA blocks it; harmless since none should slip through
    - $BRL            # Brazilian Real — currency ticker from PIE (EM fund)
    - $NOK            # Norwegian Krone
    - $JPY            # Japanese Yen
    - $EUR            # Euro
    - $GBP            # Pound Sterling
    - $KRW            # South Korean Won
    - $MXN            # Mexican Peso
    - $SAR            # Saudi Riyal
    - $TWD            # New Taiwan Dollar
    - $CNY            # Yuan Renminbi
    - Cash&Other      # placeholder ticker seen in live data
    - AGPXX           # Invesco Government & Agency Portfolio (money market fund)
    - FGXXX           # First American Government Obligations Fund (money market)
    - USBFS03         # U.S. Bank Money Market Deposit Account
    - "-"             # some scrapes emit literal "-" for unidentified rows

  # Power Query: [Company] <> "Short-Term Investment Trust - Invesco Government & Agency Portfolio"
  # Exact company-name match (case-insensitive). This is how the Excel filters AGPXX.
  blocked_name_exact:
    - "Short-Term Investment Trust - Invesco Government & Agency Portfolio"
    - "Invesco Government & Agency Portfolio"
    - "Cash & Other"  # exact name match for placeholder
    - "Cash"
    - "Other"

  # Substring match (case-insensitive). Catches money market funds and cash instruments
  # that slip through from various ETF issuers.
  blocked_name_patterns:
    - "Money Market"
    - "Securities Lending"
    - "Index Future"
    - "IFUS"
    - " FUT "
  # blocked_name_patterns:
  #   - "CASH &"
  #   - "CASH COLLATERAL"
  #   - "TREASURY"

  # Ticker punctuation standardization (BRK-B → BRK.B, BF/B → BF.B).
  ticker_replacements:
    "-": "."
    "/": "."
    " ": "."          # collapse whitespace inside tickers (e.g., "8058 JP" → "8058.JP")

  # Dual-class share consolidation (Power Query FixGoogle step).
  # Merges these tickers so they group together in the leaderboard.
  ticker_renames:
    GOOG: GOOGL

  # Cross-listing collapse (regex). Same security trading under two ticker forms
  # gets merged into one canonical leaderboard entry. Each rule is a regex
  # `pattern` and a `replacement` (back-references supported via \1, \2…).
  #
  # KRX A-prefix rule
  # -----------------
  # Korean stocks appear in two equivalent forms in the data:
  #   • Bloomberg form  "A005930"  (e.g. JHEM/MFEM holdings)
  #   • KRX exchange    "005930"   (e.g. EEMO/PIZ holdings)
  # Both refer to the same security on the Korean Stock Exchange. Without this
  # rule, Samsung Electronics fragments into two leaderboard entries with
  # split conviction. The "A" prefix is stripped and the bare 6-digit code is
  # used as the canonical form.
  #
  # Confidence: high. Pattern is tight (^A then exactly 6 digits then end of
  # string). Verified against live data: every A-prefix Korean ticker has a
  # bare-6-digit counterpart with a matching company name (Samsung, SK Hynix,
  # Hyundai, Shinhan, etc.). False-positive risk: an actual non-Korean ticker
  # of the form A###### would be incorrectly stripped — none exist in the
  # 30-ETF universe (verified).
  cross_listing_patterns:
    - {pattern: '^A(\d{6})$', replacement: '\1'}   # KRX: A005930 → 005930

# =============================================================================
# TIERS — Predator Protocol v1, matches the ETF_Config table in the Excel.
# =============================================================================
# =============================================================================
# ETF UNIVERSE — per-ETF tier and point assignment.
# Matches Excel ETF_Config table exactly. FPXI and IMOM have per-ETF point
# overrides (60) that differ from their tier's default — this is the whole
# reason we moved away from grouping by tier.
# =============================================================================
etfs:
  # Scout — spinoffs and IPOs
  - {ticker: CSD,  tier: Scout,   points: 40}
  - {ticker: FPX,  tier: Scout,   points: 40}

  # Quant — factor-based momentum
  - {ticker: QMOM, tier: Quant,   points: 40}
  - {ticker: XMMO, tier: Quant,   points: 40}
  - {ticker: XSMO, tier: Quant,   points: 40}
  - {ticker: PIE,  tier: Quant,   points: 40}

  # ─── International Exception ────────────────────────────────────────────
  # FPXI and IMOM are international funds with naturally lower overlap with
  # US-only ETFs. Bumping their points to 60 levels the playing field for
  # global names that otherwise wouldn't accumulate score across multiple ETFs.
  # They stay in their conceptual tier (Scout / Quant) so NEW-entry boost and
  # SPEC-β logic continue to apply correctly.
  - {ticker: FPXI, tier: Scout,   points: 60}
  - {ticker: IMOM, tier: Quant,   points: 60}

  # New Quant additions — Dorsey Wright momentum family + EM momentum
  # PDP / DWAS: US-focused DW momentum → 40 pts (same as QMOM/XMMO)
  # EEMO / PIZ:  international-focused → 60 pts (same as IMOM, levels the field)
  - {ticker: PDP,  tier: Quant,   points: 40}
  - {ticker: DWAS, tier: Quant,   points: 40}
  - {ticker: EEMO, tier: Quant,   points: 60}
  - {ticker: PIZ,  tier: Quant,   points: 60}
  # JH Multifactor family + PIMCO RAFI
  - {ticker: JHMM, tier: Quant,   points: 40}  # JH Multifactor Mid Cap
  - {ticker: JHEM, tier: Quant,   points: 60}  # JH Multifactor Emerging Markets (intl)
  - {ticker: JHSC, tier: Quant,   points: 40}  # JH Multifactor Small Cap
  - {ticker: MFEM, tier: Quant,   points: 60}  # PIMCO RAFI Dynamic Multi-Factor EM (intl)
  - {ticker: JOET, tier: Quant,   points: 40}  # Virtus Terranova US Quality Momentum

  # Quality — free cash flow and profitability
  - {ticker: COWZ, tier: Quality, points: 30}
  - {ticker: CALF, tier: Quality, points: 30}
  - {ticker: SPHQ, tier: Quality, points: 30}
  - {ticker: IVAL, tier: Quality, points: 30}  # Alpha Architect Intl Quantitative Value
  - {ticker: QVAL, tier: Quality, points: 30}  # Alpha Architect US Quantitative Value
  - {ticker: VLUE, tier: Quality, points: 30}  # iShares MSCI USA Value Factor
  - {ticker: AVSC, tier: Quality, points: 30}  # Avantis US Small Cap Value
  - {ticker: GRIN, tier: Quality, points: 30}  # VictoryShares Intl Free Cash Flow Growth

  # Trend — momentum confirmation
  - {ticker: SPMO, tier: Trend,   points: 10}
  - {ticker: SPHB, tier: Trend,   points: 10}
  - {ticker: RPG,  tier: Trend,   points: 10}

  # Core — mega-cap benchmarks
  - {ticker: XLG,  tier: Core,    points: 2}
  - {ticker: QQQM, tier: Core,    points: 2}

# Rank multiplier inside each ETF (Power Query AddRankBonus step).
rank_breakpoints:
  - {rank_max: 10,  multiplier: 1.5}
  - {rank_max: 30,  multiplier: 1.2}
  - {rank_max: 999, multiplier: 1.0}

# NEW entrant detection (Power Query CalcStatus step in fn_GetETF).
# `Status = "NEW"` when [Rank Past] is null — i.e., ticker absent from the
# snapshot `new_lookback_days` days ago. fn_GetETF uses -14; matches here.
new_lookback_days: 14
new_bonus_mult: 5.0
new_bonus_tiers: [Scout, Quant]

# Conviction flagging (Power Query AddFlag step).
high_conviction_min_etfs: 4

# =============================================================================
# SCORING MODE — controls which formula is used.
#
# 'legacy'     : Original Power Query formula (weight%×100 × rank_mult × points).
#                Backward-compatible; all existing tests pass.
# 'conviction' : §24 conviction-weighted formula (OW × RP × points).
#                Fixes the ITUB4 > Samsung structural bias.
# 'apex'       : §30 Predator v3. Conviction per-holding scoring, then the
#                per-ticker raw mass is shaped by concentration (HHI guard),
#                strategy-breadth entropy, and shrunk universe normalization.
#                Adds the bounded velocity overlay (apex_score / apex_rank).
# =============================================================================
scoring_mode: apex

# =============================================================================
# CONVICTION SCORING PARAMETERS (used when scoring_mode = conviction)
# §24: C_i = Wovr(OW_i) × Grank(RP_i)
#   OW_i  = w_i × n_i  (overweight vs equal-weight; 1 = equal-weight)
#   RP_i  = 1 − (r_i − 1)/n_i  (rank percentile; 1 = top of book)
#   Wovr(OW) = clamp( ln(1+OW) / ln(1+OW_star) , 0 , C_max )
#   Grank(RP) = RP_floor + (1 − RP_floor) × RP
# =============================================================================
conviction:
  ow_star:   4.0    # OW at which Wovr ≈ 1.0 (calibration anchor)
  c_max:     1.5    # ceiling on Wovr (prevents extreme outliers dominating)
  rp_floor:  0.35   # minimum Grank contribution (rank never fully zeroes out)
  hc_theta:  0.8    # conviction threshold for HIGH_CONVICTION breadth count

# =============================================================================
# APEX SCORING PARAMETERS (§30, used when scoring_mode = apex)
# Final = B × M_conc × M_breadth × M_universe, where B is the conviction raw
# mass Σ points_i × C_i. Per-holding math is identical to conviction mode.
# =============================================================================
apex:
  conc_floor:       0.60   # concentration floor — single-fund monsters stay visible
                           # at >= 60% of raw mass (owner directive: really large
                           # single bets must never disappear from the board)
  conc_target_neff: 3.0    # effective-ETF count (1/HHI) at which the
                           # concentration penalty fully releases to 1.0
  breadth_alpha:    0.35   # max uplift when independent strategy tiers co-sign
                           # (entropy of tier shares rewards style dispersal)
  universe_eta:     0.50   # exponent damping universe normalization (sqrt —
                           # halves the log-slope of the penetration ratio)
  universe_lambda:  40.0   # shrinkage pseudo-mass added to opportunity mass
                           # (~ one median fund's points; tames tiny universes)
  universe_clip_lo: 0.80   # floor on universe multiplier — levels intl names
  universe_clip_hi: 1.25   # ceiling — without false positives from clipping
  conc_flag_share:  0.85   # max-share threshold for the CONCENTRATED flag —
                           # one fund supplies >= 85% of score mass (>= 2 ETFs),
                           # above this universe's structural median of ~0.81
  # §31.2 conviction-quality multiplier applied inside the apex kicker
  # (display-ranking only — final_score is NOT touched).
  # breadth-summed score lets multi-fund filler outrank single-fund conviction;
  # m_conv = clip(avg_conviction, conv_floor, conv_cap) ** conv_gamma
  # discounts underweight breadth (<1) and rewards overweight conviction (>1).
  conv_floor:       0.50   # floor: deepest discount a filler can receive
  conv_cap:         1.25   # cap: maximum boost a high-conviction name can receive
  conv_gamma:       1.0    # exponent: 1.0 = linear scaling (default)

# =============================================================================
# ETF MATURITY GATE (§28) — suppresses NEW flood from the 15→30 migration.
# A ticker is only flagged NEW-in-ETF if the ETF itself has been tracked for
# at least `etf_maturity_days` days. Immature ETFs contribute to scoring but
# not to NEW flags or new-entrant bonuses.
# =============================================================================
etf_maturity_days: 30   # ETFs tracked < 30 days are considered immature

# =============================================================================
# HISTORY — temporal analytics layer on top of the Power Query algorithm.
# These are NEW capabilities the Excel didn't have: daily snapshots, streaks,
# percentile-of-own-history, day-over-day changelog.
# =============================================================================
history:
  delta_periods_days: [1, 7, 14, 30, 60, 90]    # Phase 2.5: add 60d, 90d
  rank_delta_lookback_days: 7                    # backward-compat default
  leaderboard_lookback_days: 120                 # bumped to cover 90d period
  changelog_top_n: 15
