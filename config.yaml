# Conviction Labs — scoring & sanitizer configuration.
# CALIBRATED to match the Excel Power Query (`Master_Leaderboard`) exactly.
# Source M code transcribed from Equity_Indices_.xlsb Advanced Editor screenshots.
#
# Push a change here → site auto-rebuilds.

# =============================================================================
# SANITIZER — mirrors the Power Query `Filtered Rows` step verbatim.
# Plus the documented GOOG → GOOGL `FixGoogle` normalization.
# =============================================================================
sanitizer:
  # Power Query: [Ticker] <> "$USD" and [Ticker] <> "USD"
  blocked_tickers:
    - USD
    - $USD
    - $CAD            # VBA blocks it; harmless since none should slip through
    - $BRL            # Brazilian Real — currency ticker from PIE (EM fund)
    - $NOK            # Norwegian Krone
    - $JPY            # Japanese Yen
    - $EUR            # Euro
    - $GBP            # Pound Sterling
    - $KRW            # South Korean Won
    - $MXN            # Mexican Peso
    - $SAR            # Saudi Riyal
    - $TWD            # New Taiwan Dollar
    - $CNY            # Yuan Renminbi
    - $AED            # UAE Dirham        (2026-08 audit: seen in live data)
    - $CHF            # Swiss Franc       (2026-08 audit)
    - $HKD            # Hong Kong Dollar  (2026-08 audit)
    - $SEK            # Swedish Krona     (2026-08 audit)
    - $ZAR            # South African Rand (2026-08 audit)
    # Bare currency codes that represent cash/equivalents in holdings
    - EUR
    - JPY
    - GBP
    - CAD
    - CHF
    - AUD
    - HKD
    - SGD
    - SEK
    - NOK
    - INR
    - TWD
    - KRW
    - BRL
    - MXN
    - ZAR
    - CNY
    - DKK
    - HUF
    - TRY
    - THB
    - AED
    - SAR
    - QAR
    - ILS
    - CLP
    - CZK
    - RON
    - PLN
    - NZD
    - MYR
    - PHP
    - Cash&Other      # placeholder ticker seen in live data
    - AGPXX           # Invesco Government & Agency Portfolio (money market fund)
    - FGXXX           # First American Government Obligations Fund (money market)
    - USBFS03         # U.S. Bank Money Market Deposit Account
    - "-"             # some scrapes emit literal "-" for unidentified rows

  # Power Query: [Company] <> "Short-Term Investment Trust - Invesco Government & Agency Portfolio"
  # Exact company-name match (case-insensitive). This is how the Excel filters AGPXX.
  blocked_name_exact:
    - "Short-Term Investment Trust - Invesco Government & Agency Portfolio"
    - "Invesco Government & Agency Portfolio"
    - "Cash & Other"  # exact name match for placeholder
    - "Cash"
    - "Other"

  # Substring match (case-insensitive). Catches money market funds and cash instruments
  # that slip through from various ETF issuers.
  blocked_name_patterns:
    - "Money Market"
    - "Securities Lending"
    - "Index Future"
    - "IFUS"
    - " FUT "
    - "CASH &"
    - "CASH COLLATERAL"

  # Ticker punctuation standardization (BRK-B → BRK.B, BF/B → BF.B).
  ticker_replacements:
    "-": "."
    "/": "."
    " ": "."          # collapse whitespace inside tickers (e.g., "8058 JP" → "8058.JP")

  # Dual-class share consolidation (Power Query FixGoogle step).
  # Merges these tickers so they group together in the leaderboard.
  ticker_renames:
    GOOG: GOOGL
    ASML: ASML.NA
    # v4 share-class consolidation (2026-10 study). Conviction is a company-level
    # read, so voting / non-voting / preferred lines of one issuer pool into the
    # most widely held line — the same logic as GOOG → GOOGL. Each pair was
    # verified against holder-reported names in the live store.
    "005935": "005930"   # Samsung Electronics pref → common (EEMO holds both)
    "005385": "005380"   # Hyundai Motor pref → common
    "005387": "005380"   # Hyundai Motor 2nd pref → common
    PETR3: PETR4         # Petrobras ON → PN (JHEM & EEMO hold both)
    ITUB3: ITUB4         # Itaú Unibanco ON → PN
    BBDC3: BBDC4         # Bradesco ON → PN
    AXIA7: AXIA3         # Axia Energia (ex-Eletrobras) PNC → ON
    PFCIBEST: CIBEST     # Grupo Cibest pref → common
    GMEXICO.B: GMEXICOB  # Grupo México — issuer spelling variants
    FEMSA.UBD: FEMSAUBD  # FEMSA units — issuer spelling variants
    ENELCHIL: ENELCHILE  # Enel Chile — truncated symbol
    FOX: FOXA            # Fox Corp class B → A
    NWS: NWSA            # News Corp class B → A
    LBTYK: LBTYA         # Liberty Global C → A
    UA: UAA              # Under Armour C → A
    LILAK: LILA          # Liberty Latin America C → A
    GEF.B: GEF           # Greif B → A
    UHAL.B: UHAL         # U-Haul non-voting → voting
    # NOT merged: ENR (Energizer, AVSC) vs ENR.GR (Siemens Energy, GRIN) — the
    # 2026-10 audit proposed this merge, but they are different companies.

  # Cross-listing collapse (regex). Same security trading under two ticker forms
  # gets merged into one canonical leaderboard entry. Each rule is a regex
  # `pattern` and a `replacement` (back-references supported via \1, \2…).
  #
  # KRX A-prefix rule
  # -----------------
  # Korean stocks appear in two equivalent forms in the data:
  #   • Bloomberg form  "A005930"  (e.g. JHEM/MFEM holdings)
  #   • KRX exchange    "005930"   (e.g. EEMO/PIZ holdings)
  # Both refer to the same security on the Korean Stock Exchange. Without this
  # rule, Samsung Electronics fragments into two leaderboard entries with
  # split conviction. The "A" prefix is stripped and the bare 6-digit code is
  # used as the canonical form.
  #
  # Confidence: high. Pattern is tight (^A then exactly 6 digits then end of
  # string). Verified against live data: every A-prefix Korean ticker has a
  # bare-6-digit counterpart with a matching company name (Samsung, SK Hynix,
  # Hyundai, Shinhan, etc.). False-positive risk: an actual non-Korean ticker
  # of the form A###### would be incorrectly stripped — none exist in the
  # 30-ETF universe (verified).
  cross_listing_patterns:
    - {pattern: '^A(\d{6})$', replacement: '\1'}   # KRX: A005930 → 005930

  # v4 name-verified identity resolution (conviction/scoring.py
  # Sanitizer._resolve_identities). Two measured defects:
  #   • collisions — international funds report bare local codes that clash
  #     with unrelated US tickers: 'MTN' was Vail Resorts (AVSC, JHSC) AND MTN
  #     Group (JHEM, MFEM), fabricating a 4-fund HIGH_CONVICTION name in the
  #     top 20. ~50 tickers affected (KTB, A, TEL, G, KEY, KMB, PRU, SAIL, VAL…).
  #     The international cluster is renamed '<ticker>.<TAG>' (MTN → MTN.MTN).
  #   • fragmentation — exchange-suffix dialects of one security ('6857' vs
  #     '6857.JP', 'ADVANC' vs 'ADVANC.R') collapse into the root symbol.
  # Every split/merge requires holder-reported company names to agree (or
  # disagree), so e.g. ENR.GR (Siemens Energy) is never folded into ENR.
  # Which funds report local-exchange symbols comes from `region: intl` below.
  resolve_identities: true

  # Partial-snapshot guard (2026-10). A fund snapshot whose sanitized weight
  # sum is below this fraction of the fund's trailing median (previous 10
  # snapshots) was scraped incompletely and is skipped — the fund's last
  # complete book stays in force. Without it, EEMO's 2026-08-29 partial scrape
  # (72% of weight, SK hynix missing) knocked SK hynix from #3 to #34 for two
  # days and fired fake BURST/CRATER moves. Measured: 13 such snapshots in the
  # store (EEMO ×3, JHEM ×2, eight funds' top-10-only scrape on 2026-02-23);
  # genuine reconstitutions (EEMO 261 → 211 names, weights ≈ 100%) pass.
  partial_snapshot_min_ratio: 0.90

  # Curated row-level overrides for collisions BETWEEN international exchanges
  # (no US holder to anchor the automatic split, and spelling variants such as
  # ICBC's 'IND + COMM BK' / 'Industrial & Commercial Bank' make a name-only
  # rule unsafe). `name` is a case-insensitive regex on the holder-reported
  # company name; `to` uses an exchange suffix the price resolver understands.
  identity_overrides:
    - {ticker: "2313", name: "SHENZHOU",    to: "2313.HK"}   # vs Compeq Manufacturing (TW)
    - {ticker: "2382", name: "SUNNY OPT",   to: "2382.HK"}   # vs Quanta Computer (TW)
    - {ticker: "1519", name: "J.T GLOBAL",  to: "1519.HK"}   # J&T Express vs Fortune Electric (TW)
    - {ticker: "6269", name: "MODEC",       to: "6269.JP"}   # vs Flexium Interconnect (TW)
    - {ticker: "8210", name: "CHENBRO",     to: "8210.TT"}   # vs Bupa Arabia (SA)
    - {ticker: JSW,    name: "JASTRZEBSKA", to: "JSW.PW"}    # vs JSW Energy (IN)
    - {ticker: LTM,    name: "^LTM LTD",    to: "LTM.NS"}    # LTM (ex-LTIMindtree, IN) vs LATAM Airlines
    - {ticker: SAP,    name: "SAPPI",       to: "SAP.SJ"}    # vs SAP SE

# =============================================================================
# TIERS — Conviction Labs v1, matches the ETF_Config table in the Excel.
# =============================================================================
# =============================================================================
# ETF UNIVERSE — per-ETF tier and point assignment.
# Matches Excel ETF_Config table exactly. FPXI and IMOM have per-ETF point
# overrides (60) that differ from their tier's default — this is the whole
# reason we moved away from grouping by tier.
# =============================================================================
etfs:
  # Scout — spinoffs and IPOs
  - {ticker: CSD,  tier: Scout,   points: 40}
  - {ticker: FPX,  tier: Scout,   points: 40}

  # Quant — factor-based momentum
  - {ticker: QMOM, tier: Quant,   points: 40}
  - {ticker: XMMO, tier: Quant,   points: 40}
  - {ticker: XSMO, tier: Quant,   points: 40}
  - {ticker: PIE,  tier: Quant,   points: 40, region: intl}

  # ─── International funds ────────────────────────────────────────────────
  # Until v4, FPXI / IMOM / EEMO / PIZ / JHEM / MFEM carried a 60-point
  # "international exception" to level the field for global names. That job
  # is done by apex M_universe (opportunity normalization), so the bump was a
  # second levelling mechanism stacked on the first — and with four
  # overlapping EM funds it no longer levelled anything: under the v4 κ = 2
  # convexity it would have pushed the top-50 to 76% non-US names (vs 56%
  # pre-v4, 41.5% of holding-points). Every fund now earns its tier's points;
  # with κ = 2 the top-50 sits at 60% non-US (2026-10 study,
  # docs/SCORING_V4_STUDY.md). `region: intl` marks funds that report
  # local-exchange symbols (used only by identity resolution).
  - {ticker: FPXI, tier: Scout,   points: 40, region: intl}
  - {ticker: IMOM, tier: Quant,   points: 40, region: intl}

  # New Quant additions — Dorsey Wright momentum family + EM momentum
  # PDP / DWAS: US-focused DW momentum; EEMO / PIZ: EM / developed-intl momentum
  - {ticker: PDP,  tier: Quant,   points: 40}
  - {ticker: DWAS, tier: Quant,   points: 40}
  - {ticker: EEMO, tier: Quant,   points: 40, region: intl}
  - {ticker: PIZ,  tier: Quant,   points: 40, region: intl}
  # JH Multifactor family + PIMCO RAFI
  - {ticker: JHMM, tier: Quant,   points: 40}  # JH Multifactor Mid Cap
  - {ticker: JHEM, tier: Quant,   points: 40, region: intl}  # JH Multifactor Emerging Markets
  - {ticker: JHSC, tier: Quant,   points: 40}  # JH Multifactor Small Cap
  - {ticker: MFEM, tier: Quant,   points: 40, region: intl}  # PIMCO RAFI Dynamic Multi-Factor EM
  - {ticker: JOET, tier: Quant,   points: 40}  # Virtus Terranova US Quality Momentum

  # Quality — free cash flow and profitability
  - {ticker: COWZ, tier: Quality, points: 30}
  - {ticker: CALF, tier: Quality, points: 30}
  - {ticker: SPHQ, tier: Quality, points: 30}
  - {ticker: IVAL, tier: Quality, points: 30, region: intl}  # Alpha Architect Intl Quantitative Value
  - {ticker: QVAL, tier: Quality, points: 30}  # Alpha Architect US Quantitative Value
  - {ticker: VLUE, tier: Quality, points: 30}  # iShares MSCI USA Value Factor
  - {ticker: AVSC, tier: Quality, points: 30}  # Avantis US Small Cap Value
  - {ticker: GRIN, tier: Quality, points: 30, region: intl}  # VictoryShares Intl Free Cash Flow Growth

  # Trend — momentum confirmation
  - {ticker: SPMO, tier: Trend,   points: 10}
  - {ticker: SPHB, tier: Trend,   points: 10}
  - {ticker: RPG,  tier: Trend,   points: 10}

  # Core — mega-cap benchmarks
  - {ticker: XLG,  tier: Core,    points: 2}
  - {ticker: QQQM, tier: Core,    points: 2}

# Rank multiplier inside each ETF (Power Query AddRankBonus step).
rank_breakpoints:
  - {rank_max: 10,  multiplier: 1.5}
  - {rank_max: 30,  multiplier: 1.2}
  - {rank_max: 999, multiplier: 1.0}

# NEW entrant detection (Power Query CalcStatus step in fn_GetETF).
# `Status = "NEW"` when [Rank Past] is null — i.e., ticker absent from the
# snapshot `new_lookback_days` days ago. fn_GetETF uses -14; matches here.
new_lookback_days: 14
new_bonus_mult: 5.0
new_bonus_tiers: [Scout, Quant]

# HIGH_CONVICTION (2026-10 redesign, docs/SIGNALS_STUDY.md) — broad AND
# convinced AND independent:
#   ≥ high_conviction_min_etfs holders, of which
#   ≥ high_conviction_min_conviction_etfs non-benchmark funds hold the name at
#     conviction ≥ conviction.hc_theta (≈ 2× equal weight near the top of the
#     book), spanning
#   ≥ high_conviction_min_tiers non-benchmark strategy tiers.
# The old raw "≥ 4 holders" rule fit the 16-fund universe (~38 names) but not
# the 30-fund one (~200 names: four funds hold 500–1,300 names each). The
# conviction rule flags ~20–25 names; they lose a holder within 30 days 15% of
# the time vs 27%. Core (XLG, QQQM) is a cap-weighted benchmark — it
# "overweights" mega-caps by size — so it never counts as conviction or as an
# independent strategy. Legacy scoring mode keeps the raw count rule.
high_conviction_min_etfs: 4
high_conviction_min_conviction_etfs: 2
high_conviction_min_tiers: 2
high_conviction_exclude_tiers: [Core]

# BURST / CRATER (2026-10 redesign, docs/SIGNALS_STUDY.md). On the leaderboard
# rank smoothed by a rolling median of `smooth_snapshots` (a one-day spike can't
# move it), over the last `lookback_snapshots` snapshots:
#   BURST  — rank improved by ≥ min_log_rank_move in log terms (×1.65, e.g.
#            #250 → #150), is now inside the top `relevance_rank`, is still
#            within persist_log_tol of its best, and the name GAINED a fund.
#   CRATER — the mirror: rank worsened ×1.65 from inside the top
#            `relevance_rank`, still near its worst, and the name LOST a fund.
# The old rule (worst − best rank ≥ 40 over 30 days, no direction) flagged
# ~850 names a day (median rank ~1,700) and its CRATER names outperformed.
# The new rule flags ~6–9 a day each: BURST onsets +5.2% vs peers over 20 days
# in Feb–May (−0.9%, not significant, in the May–Oct momentum unwind); CRATER
# onsets −1.7% / −2.0% — negative in both regimes.
motion:
  smooth_snapshots: 3
  lookback_snapshots: 10
  min_log_rank_move: 0.5
  relevance_rank: 300
  persist_log_tol: 0.15
  require_fund_confirmation: true

# =============================================================================
# SCORING MODE — controls which formula is used.
#
# 'legacy'     : Original Power Query formula (weight%×100 × rank_mult × points).
#                Backward-compatible; all existing tests pass.
# 'conviction' : §24 conviction-weighted formula (OW × RP × points).
#                Fixes the ITUB4 > Samsung structural bias.
# 'apex'       : §30 Conviction v3. Conviction per-holding scoring, then the
#                per-ticker raw mass is shaped by concentration (HHI guard),
#                strategy-breadth entropy, and shrunk universe normalization.
#                v4 (2026-10): κ-convex per-holding conviction, one breadth
#                reward, one regional levelling term, identity resolution;
#                final_score is the single canonical rank (apex_* are aliases).
# =============================================================================
scoring_mode: apex

# =============================================================================
# CONVICTION SCORING PARAMETERS (used when scoring_mode = conviction)
# §24: C_i = Wovr(OW_i) × Grank(RP_i)
#   OW_i  = w_i × n_i  (overweight vs equal-weight; 1 = equal-weight)
#   RP_i  = 1 − (r_i − 1)/n_i  (rank percentile; 1 = top of book)
#   Wovr(OW) = clamp( ln(1+OW) / ln(1+OW_star) , 0 , C_max )
#   Grank(RP) = RP_floor + (1 − RP_floor) × RP
# =============================================================================
conviction:
  ow_star:   4.0    # OW at which Wovr ≈ 1.0 (calibration anchor)
  c_max:     1.5    # ceiling on Wovr (prevents extreme outliers dominating)
  rp_floor:  0.35   # minimum Grank contribution (rank never fully zeroes out)
  hc_theta:  0.6    # conviction a holding needs to count toward HIGH_CONVICTION
                    # (≈ 2× equal weight near the top of the book); was a 0.8
                    # diagnostic-only threshold before the 2026-10 HC redesign
  kappa:     2.0    # v4 per-holding convexity: Single_i = points × C_i^κ.
                    # Shrinks breadth-filler holdings (C=0.3 → 0.09) without the
                    # non-monotone averaging of the retired m_conv / gate. Applies in
                    # apex mode only. 2026-10 study (engine replay, 30-ETF universe):
                    # top-50 filler share 17.6% → 4.8%, top-50 30-day exit rate
                    # 18.8% → 14.4%, forward fund-accumulation IC −0.009 → +0.018.
  overlap_discount_enabled: true
  overlap_penalty_weight:   1.5    # Scales Jaccard overlap discount rate
  min_overlap_multiplier:   0.20   # Floor multiplier for heavily overlapped ETFs
  tier_diversity_bonus:     0.15   # +15% per extra tier — conviction mode ONLY; ignored
                                   # in apex mode, where M_breadth already rewards tier
                                   # dispersal (stacking both double-counted breadth)

# =============================================================================
# APEX SCORING PARAMETERS (§30, used when scoring_mode = apex)
# Final = B × M_conc × M_breadth × M_universe, where B is the conviction raw
# mass Σ points_i × C_i. Per-holding math is identical to conviction mode.
# =============================================================================
apex:
  conc_floor:       0.60   # concentration floor — single-fund monsters stay visible
                           # at >= 60% of raw mass (owner directive: really large
                           # single bets must never disappear from the board)
  conc_target_neff: 3.0    # effective-ETF count (1/HHI) at which the
                           # concentration penalty fully releases to 1.0
  breadth_alpha:    0.35   # max uplift when independent strategy tiers co-sign
                           # (entropy of tier shares rewards style dispersal)
  universe_eta:     0.50   # exponent damping universe normalization (sqrt —
                           # halves the log-slope of the penetration ratio)
  universe_lambda:  40.0   # shrinkage pseudo-mass added to opportunity mass
                           # (~ one median fund's points; tames tiny universes)
  universe_clip_lo: 0.80   # floor on universe multiplier — levels intl names
  universe_clip_hi: 1.25   # ceiling — without false positives from clipping
  conc_flag_share:  0.85   # max-share threshold for the CONCENTRATED flag —
                           # one fund supplies >= 85% of score mass (>= 2 ETFs),
                           # above this universe's structural median of ~0.81

# =============================================================================
# ETF MATURITY GATE (§28) — suppresses NEW flood from the 15→30 migration.
# A ticker is only flagged NEW-in-ETF if the ETF itself has been tracked for
# at least `etf_maturity_days` days. Immature ETFs contribute to scoring but
# not to NEW flags or new-entrant bonuses.
# =============================================================================
etf_maturity_days: 30   # ETFs tracked < 30 days are considered immature

# v4 staleness guard — an ETF whose newest snapshot is older than this many
# days (relative to the as-of date) stops contributing. Well above the longest
# observed scrape gap (21 days) so outages never fake exits; it retires feeds
# that have actually died instead of scoring a frozen book forever.
stale_snapshot_days: 30

# =============================================================================
# HISTORY — temporal analytics layer on top of the Power Query algorithm.
# These are NEW capabilities the Excel didn't have: daily snapshots, streaks,
# percentile-of-own-history, day-over-day changelog.
# =============================================================================
history:
  delta_periods_days: [1, 7, 14, 30, 60, 90]    # Phase 2.5: add 60d, 90d
  rank_delta_lookback_days: 7                    # backward-compat default
  leaderboard_lookback_days: 120                 # bumped to cover 90d period
  changelog_top_n: 15
