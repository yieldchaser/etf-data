[pytest]
# Scope collection to the tests/ directory and .py files only. Without this,
# running bare `pytest` from the repo root tries to import every file matching
# the default test_* glob, including artifacts like test_full_results.txt —
# which is UTF-16 LE (PowerShell redirect output) and crashes collection with
# a UnicodeDecodeError. (BUG-8)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep hypothesis (property-based testing) bounded so CI runs are deterministic
# and fast; the codebase already sets profiles elsewhere, this is a backstop.
filterwarnings =
    ignore::DeprecationWarning
